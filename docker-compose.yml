services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mdm
      POSTGRES_USER: mdm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ghcr.io/foylaou/mdm-api:${IMAGE_TAG:-latest}
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://mdm:${POSTGRES_PASSWORD:-mdm}@postgres:5432/mdm?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      MICROMDM_URL: ${MICROMDM_URL}
      MICROMDM_API_KEY: ${MICROMDM_API_KEY}
      WEBSOCKET_URL: ${WEBSOCKET_URL}
      VPP_TOKEN_PATH: ${VPP_TOKEN_PATH:-}
      LISTEN_ADDR: ":8080"
      # 派發系統整合 API（獨立連接埠，見 docs/dispatch-integration.md）。留空 = 不啟用。
      INTEGRATION_LISTEN_ADDR: ${INTEGRATION_LISTEN_ADDR:-}
      INTEGRATION_TRUSTED_PROXIES: ${INTEGRATION_TRUSTED_PROXIES:-}
    # cloudflared 與 api 在同一個 compose 網路時，tunnel 直接指向 http://api:8081 即可，不用開 port；
    # cloudflared 跑在主機上時，打開下面這行（只綁本機，不對外）：
    # ports:
    #   - "127.0.0.1:8081:8081"
    restart: unless-stopped

  web:
    image: ghcr.io/foylaou/mdm-web:${IMAGE_TAG:-latest}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  pgdata:
